# deny.toml — Project Obsidian dependency security policy
# Enforced by `cargo deny check` in CI (cargo-deny >= 0.14)

[advisories]
# Use the RustSec Advisory Database to detect known CVEs in dependencies
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Warn on unmaintained crates
unmaintained = "workspace"
# Deny yanked crate versions
yanked = "deny"
# Ignore specific advisories if they don't affect our use case
ignore = []

[licenses]
# Only allow permissive open-source licenses — GPL is incompatible with distribution
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "OpenSSL",
    "Unicode-DFS-2016",
    "MS-PL",
    "BSL-1.0",
]
# Skip checking the obsidian binary itself (it has no explicit license in Cargo.toml)
private = { ignore = true }
confidence-threshold = 0.8

[bans]
# Warn on multiple versions of the same crate (supply-chain risk)
multiple-versions = "warn"
# Deny wildcard dependencies in our own workspace
wildcards = "deny"
# Explicitly forbidden crates
deny = [
    # openssl bindings have had recurring CVEs — we use native Windows TLS
    { name = "openssl" },
    # time 0.1.x has a known soundness issue (RUSTSEC-2020-0071)
    { name = "time", version = "<0.2" },
]

[sources]
# Only allow crates from crates.io — no git dependencies in production
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
