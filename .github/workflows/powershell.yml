name: PowerShell Pester CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pester:
    name: Pester Tests + PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester (pinned v5)
        shell: pwsh
        run: |
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run Pester Safety Tests
        shell: pwsh
        run: |
          Invoke-Pester -Path .\tests\powershell\ -Output Detailed -CI

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run PSScriptAnalyzer on PowerShell scripts
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path .\powershell\ -Recurse -Severity Warning, Error
          $results += Invoke-ScriptAnalyzer -Path .\Obsidian.ps1 -Severity Warning, Error
          $results += Invoke-ScriptAnalyzer -Path .\Restore-Obsidian.ps1 -Severity Warning, Error
          if ($results.Count -gt 0) {
            $results | Format-Table -AutoSize
            Write-Error "PSScriptAnalyzer found $($results.Count) issue(s)."
            exit 1
          } else {
            Write-Host "[V] PSScriptAnalyzer: All scripts passed." -ForegroundColor Green
          }
