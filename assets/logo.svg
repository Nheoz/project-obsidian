<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="obsidianGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#6b11ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="200" height="200" rx="40" fill="#0d1117" />
  <!-- Monolithic Obsidian Crystal -->
  <polygon points="100,30 155,75 140,150 100,175 60,150 45,75" fill="url(#obsidianGrad)" filter="url(#glow)" opacity="0.9" />
  <!-- Inner Facets -->
  <polygon points="100,30 100,105 45,75" fill="#ffffff" opacity="0.2" />
  <polygon points="100,30 155,75 100,105" fill="#000000" opacity="0.25" />
  <polygon points="100,105 140,150 100,175" fill="#ffffff" opacity="0.1" />
  <polygon points="100,105 100,175 60,150" fill="#000000" opacity="0.35" />
  <!-- Core Rune / Cyber Shield -->
  <circle cx="100" cy="105" r="8" fill="#00f2fe" />
</svg>
