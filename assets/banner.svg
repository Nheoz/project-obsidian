<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200" stroke="#1e293b" stroke-width="1" opacity="0.4" />
  <path d="M200 0 V400 M400 0 V400 M600 0 V400 M800 0 V400 M1000 0 V400" stroke="#1e293b" stroke-width="1" opacity="0.4" />

  <!-- Geometric Crystal Monolith -->
  <g transform="translate(180, 200) scale(1.1)">
    <polygon points="0,-120 90,-40 65,90 0,130 -65,90 -90,-40" fill="url(#accentGrad)" opacity="0.85" />
    <polygon points="0,-120 0,20 -90,-40" fill="#ffffff" opacity="0.25" />
    <polygon points="0,-120 90,-40 0,20" fill="#000000" opacity="0.3" />
    <polygon points="0,20 65,90 0,130" fill="#ffffff" opacity="0.15" />
    <polygon points="0,20 0,130 -65,90" fill="#000000" opacity="0.4" />
    <circle cx="0" cy="20" r="12" fill="#00f2fe" />
  </g>

  <!-- Title & Branding -->
  <text x="360" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="72" fill="url(#textGrad)" letter-spacing="4">PROJECT OBSIDIAN</text>
  <text x="365" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="24" fill="#00f2fe" letter-spacing="1">FORGE WINDOWS INTO A PRIVACY-FIRST AI &amp; GAMING WORKSTATION</text>
  <text x="365" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="16" fill="#64748b">Zero Placebos • Anti-Cheat Safe • Guaranteed Rollback • Enterprise PowerShell Layer</text>
</svg>
