<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0f" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Cybernetic Grid overlay -->
  <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200" stroke="#1e293b" stroke-width="1" opacity="0.3" />
  <path d="M200 0 V400 M400 0 V400 M600 0 V400 M800 0 V400 M1000 0 V400" stroke="#1e293b" stroke-width="1" opacity="0.3" />

  <!-- Geometric Crystal Monolith -->
  <g transform="translate(150, 200) scale(1.05)" filter="url(#glow)">
    <polygon points="0,-115 85,-35 60,85 0,125 -60,85 -85,-35" fill="url(#accentGrad)" opacity="0.9" />
    <polygon points="0,-115 0,20 -85,-35" fill="#ffffff" opacity="0.25" />
    <polygon points="0,-115 85,-35 0,20" fill="#000000" opacity="0.25" />
    <polygon points="0,20 60,85 0,125" fill="#ffffff" opacity="0.15" />
    <polygon points="0,20 0,125 -60,85" fill="#000000" opacity="0.35" />
    <circle cx="0" cy="20" r="10" fill="#00f2fe" />
  </g>

  <!-- Title & Branding -->
  <text x="295" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="64" fill="url(#textGrad)" letter-spacing="3">PROJECT OBSIDIAN</text>
  <text x="300" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="19" fill="#00f2fe" letter-spacing="1.2">FORGE WINDOWS INTO A PRIVACY-FIRST AI &amp; GAMING WORKSTATION</text>
  <text x="300" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="15" fill="#94a3b8" letter-spacing="0.5">Zero Placebos • Anti-Cheat Safe • Guaranteed Rollback • Enterprise PowerShell Layer</text>

  <!-- Status Chip -->
  <g transform="translate(300, 280)">
    <rect width="135" height="26" rx="13" fill="#1e293b" opacity="0.8" />
    <circle cx="14" cy="13" r="4" fill="#10b981" />
    <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#10b981">v1.0.0 STABLE</text>
  </g>
  <g transform="translate(450, 280)">
    <rect width="180" height="26" rx="13" fill="#1e293b" opacity="0.8" />
    <text x="14" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">WIN 11 (23H2 - 25H2)</text>
  </g>
</svg>
