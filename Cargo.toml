[package]
name = "obsidian"
version = "2.0.0"
edition = "2021"
rust-version = "1.75"
authors = ["NheozProject <hola@synkrobyte.com>"]
description = "Forge Windows 11 into a Privacy-First AI & Gaming Workstation"
readme = "README.md"
license = "MIT"
keywords = ["windows11", "privacy", "gaming", "ai", "telemetry"]
categories = ["command-line-utilities", "os::windows-apis"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
colored = "2.1"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winres = "0.1.12"
